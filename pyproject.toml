[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-docs"
version = "0.1.0"
description = "Offline, searchable reference built from the programming courses: topics, code snippets and definitions, with aliases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur D'Aquino", email = "arthurdaquinosilva@gmail.com" }]
keywords = ["docs", "cli", "tui", "offline", "search", "devdocs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Terminals",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.8",
    "pygments>=2.15",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pyte", "pexpect"]

[project.scripts]
lore = "lore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
